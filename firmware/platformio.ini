; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Optional local override file. Create a platformio_local.ini file
; with a [common] section to override toystolifelib_dep below, e.g. to
; point at a local checkout instead of fetching from GitHub:
;   [common]
;   toystolifelib_dep = symlink://../../ToysToLifeLib
; (Glob pattern so the build doesn't fail when the file is absent.)
extra_configs = platformio_local*.ini

[common]
; Defaults to fetching ToysToLifeLib from GitHub so the build works
; regardless of local folder layout. Override via platformio_local.ini.
toystolifelib_dep = https://github.com/FromDarkHell/ToysToLifeLib.git

[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
framework = arduino

board_build.filesystem = littlefs
board_build.core = earlephilhower

build_flags =
	-DELEGANTOTA_USE_ASYNC_WEBSERVER=1
	-DUSE_TINYUSB=1
	-DUSB_CONFIG_POWER=500
	-DCFG_TUD_VENDOR=4
	-DCFG_TUD_ENDPOINT0_SIZE=8
	-DCFG_TUD_HID_EP_BUFSIZE=32
	-DCFG_TUD_VENDOR_EPSIZE=32
	-Wl,--wrap=tud_descriptor_device_cb,--wrap=tud_descriptor_bos_cb

lib_compat_mode = strict
lib_ldf_mode = deep+
lib_deps = 
	esp32async/ESPAsyncWebServer@^3.10.0
	ayushsharma82/ElegantOTA@^3.1.7
	bblanchon/ArduinoJson@^7.4.2
	https://github.com/FromDarkHell/Adafruit_TinyUSB_Arduino#dev
	fastled/FastLED@^3.10.3
	${common.toystolifelib_dep}

[env:picow]
board = rpipicow
board_build.filesystem_size = 1.5m

[env:pico2w]
board = rpipico2w
board_build.filesystem_size = 1.5m